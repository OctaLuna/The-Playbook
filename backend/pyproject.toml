[project]
name = "the-playbook-backend"
version = "0.1.0"
description = "Predicción de fútbol explicable y auditable — backend, ML y RAG"
requires-python = ">=3.12"

# Las dependencias se añaden cuando la tarea que las necesita las introduce.
# Artículo VII (Simplicidad): no se declara nada "por si acaso".
# B01 (Grupo 0): lo mínimo para levantar la app FastAPI, la sesión async a Postgres y el
# worker Celery. Las dependencias de ML (T012a) y RAG (T004b) se añaden después, cada una
# en su propio commit una vez que este archivo esté fusionado — ver equipo-y-tracks.md.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "celery>=5.4",
  "redis>=5.2",
  "pgvector>=0.3",
  "boto3>=1.35",
  "langchain>=0.3",
  # T012a (ml-design.md §8): pipeline de ML de 001 — Dixon-Coles, XGBoost, ensamble,
  # calibración y su tracking en MLflow.
  "statsmodels>=0.14",
  "scipy>=1.14",
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "mlflow>=2.17",
  "pandas>=2.2",
  "numpy>=2.0",
]

[tool.setuptools]
# app/, ml/, rag/, workers/ se importan corriendo Python desde backend/ (así asumen
# pyproject.toml, pytest y alembic.ini), nunca instalando este proyecto como paquete de
# site-packages. Sin esto, `pip install -e ".[dev]"` falla con "Multiple top-level
# packages discovered in a flat-layout": setuptools ve app/ml/rag/workers/alembic como
# paquetes candidatos y se niega a adivinar. Aquí solo instalamos las dependencias.
packages = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "ASYNC",    # flake8-async
  "S",        # flake8-bandit (seguridad)
  "T20",      # flake8-print (nada de print() en producción)
  "SIM",      # flake8-simplify
  "PTH",      # usar pathlib
  "RUF",
]
ignore = [
  "S101",  # assert: es el mecanismo de pytest
]

[tool.ruff.lint.per-file-ignores]
# Los tests pueden usar asserts, credenciales de prueba y prints de diagnóstico.
"tests/**" = ["S105", "S106", "T20"]
# ml.data.eda es un script de reporte para correr en vivo (demostración de EDA en la
# defensa), no un servicio — su salida es la consola, así que print() es el punto.
"ml/data/eda.py" = ["T20"]
# Mismo caso: ml.evaluation.baseline_demo orquesta un entrenamiento de punta a punta
# para mostrar en vivo, su salida es la tabla comparativa por consola.
"ml/evaluation/baseline_demo.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "rag", "workers"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Reconoce BaseSettings: los campos requeridos se completan desde variables de entorno,
# no desde el constructor, así que Settings() sin argumentos es válido en tiempo real.
plugins = ["pydantic.mypy"]
# Artículo I: ml/ y rag/ no importan de app/api/. mypy no lo comprueba por sí solo,
# pero mantener los módulos tipados hace evidente cualquier import cruzado.
files = ["app", "ml", "rag", "workers"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "ml"]
asyncio_mode = "auto"
# El engine async de app/db/session.py es un único objeto de proceso con su propio
# pool de conexiones asyncpg; un event loop por test (el default de pytest-asyncio)
# hace que un test reutilice, bajo un loop distinto, una conexión creada en el loop
# de otro — asyncpg la rechaza ("another operation is in progress"). Con un solo
# loop para toda la sesión de pytest, el pool y el loop coinciden siempre.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Artículo III (Test-First): estos marcadores permiten correr por fase.
markers = [
  "contract: pruebas de contrato de API — obligatorias antes de implementar un endpoint",
  "integration: pruebas contra servicios reales (Postgres, Redis, pgvector)",
  "unit: pruebas unitarias puras",
  "constitucional: guardianes de la constitución — su fallo bloquea el build",
  "pendiente_implementacion: fase Red del Artículo III — DEBE fallar hasta que exista el código",
]
# En local, `pytest` corre todo: los tests en fase Red se ven fallar, que es lo que
# exige el Artículo III. En CI se usa `-m 'not pendiente_implementacion'` para que el
# build gatee sobre los guardianes sin quedar rojo de forma permanente y perder sentido.
addopts = "-q --strict-markers"
